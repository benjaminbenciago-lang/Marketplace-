<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marketplace</title>
<meta name="description" content="Find local businesses and get your own business online.">
<style>
:root{--bg:#0e1410;--card:#17201a;--card2:#1f2b23;--line:#2a3a30;--amber:#e8a33d;--teal:#3ecf8e;--red:#ff6b6b;--text:#eef2ee;--muted:#8fa196}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
a{color:var(--teal);cursor:pointer}
.muted{color:var(--muted)}
.pad{padding:14px}
.top{background:#0c120e;padding:calc(12px + env(safe-area-inset-top,0px)) 15px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.3px;font-size:17px}
.brand b{color:var(--amber)}
.who{font-size:13px;color:var(--muted);cursor:pointer;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);margin:10px;border-radius:12px;padding:14px;border:1px solid var(--line)}
.card h3{margin:0 0 6px}
.btn{padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;font-size:14px}
.btn:disabled{opacity:.5}
.btn-amber{background:var(--amber);color:#1a1205}.btn-teal{background:var(--teal);color:#06241a}.btn-dark{background:var(--card2);color:#fff}
.two{display:flex;gap:8px}.two .btn{flex:1}
input,textarea,select{width:100%;padding:11px;background:var(--card2);border:1px solid #30402f;color:#fff;border-radius:8px;margin-top:8px;font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
.thumbBig{width:100%;height:190px;border-radius:12px;object-fit:cover;background:var(--card2)}
.ph{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--amber)}
.badge{background:var(--card2);padding:3px 9px;border-radius:20px;font-size:11px;color:var(--muted)}
.badge.featured{background:#3a2c0e;color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 13px;border-radius:20px;background:var(--card2);border:1px solid #30402f;font-size:13px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#06241a}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:99}
.navItem{text-align:center;font-size:11px;cursor:pointer;opacity:.65;flex:1}
.navItem.active{opacity:1;color:var(--teal)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.steps{padding-left:20px;line-height:1.7;font-size:14px;margin:8px 0 0}
.sqlbox{background:#0a0d0b;padding:10px;border-radius:8px;font-size:11px;overflow:auto;max-height:260px;white-space:pre;margin:8px 0 0}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>Local</b>link</div>
  <div class="who" id="who" onclick="showPage('me')">Sign in</div>
</div>

<div id="page-explore">
  <div style="padding:10px 10px 0">
    <input id="search" placeholder="Search businesses" oninput="drawList()">
    <div class="chips" id="catChips"></div>
  </div>
  <div id="exploreList"></div>
  <div id="bizView" style="display:none"></div>
</div>

<div id="page-add" style="display:none"><div id="addBody"></div></div>
<div id="page-me" style="display:none"><div id="meBody"></div></div>

<div class="bottomNav">
  <div class="navItem active" id="n-explore" onclick="showPage('explore')">🔍<br>Explore</div>
  <div class="navItem" id="n-add" onclick="showPage('add')">➕<br>List business</div>
  <div class="navItem" id="n-me" onclick="showPage('me')">👤<br>Me</div>
</div>

<div id="toast"></div>

<script type="text/plain" id="sqlText">
-- LOCALLINK - Supabase setup (run once on a fresh project)

create table public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  display_name text not null default 'User' check (char_length(display_name) between 1 and 40),
  created_at timestamptz not null default now()
);

create table public.businesses (
  id uuid primary key default gen_random_uuid(),
  owner_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  name text not null check (char_length(name) between 1 and 120),
  category text not null default 'Other' check (char_length(category) <= 60),
  description text not null default '' check (char_length(description) <= 2000),
  phone text not null default '' check (char_length(phone) <= 40),
  location text not null default '' check (char_length(location) <= 160),
  photo_url text,
  featured boolean not null default false,
  active boolean not null default true,
  created_at timestamptz not null default now()
);

create index businesses_category_idx on public.businesses (category);
create index businesses_owner_idx on public.businesses (owner_id);

create or replace function public.handle_new_user()
returns trigger
language plpgsql
security definer
set search_path = public
as $$
begin
  insert into public.profiles (id, display_name)
  values (new.id, coalesce(nullif(left(trim(new.raw_user_meta_data->>'display_name'), 40), ''), 'User'));
  return new;
end;
$$;

create trigger on_auth_user_created
  after insert on auth.users
  for each row execute function public.handle_new_user();

alter table public.profiles   enable row level security;
alter table public.businesses enable row level security;

create policy "Anyone can read profiles" on public.profiles for select using (true);
create policy "Users update their own profile" on public.profiles
  for update to authenticated using (id = auth.uid()) with check (id = auth.uid());

create policy "Anyone can read active businesses" on public.businesses
  for select using (active = true);
create policy "Owners read their own businesses" on public.businesses
  for select to authenticated using (owner_id = auth.uid());
create policy "Signed-in users create their own listing" on public.businesses
  for insert to authenticated with check (owner_id = auth.uid());
create policy "Owners update their own listing" on public.businesses
  for update to authenticated using (owner_id = auth.uid()) with check (owner_id = auth.uid());
create policy "Owners delete their own listing" on public.businesses
  for delete to authenticated using (owner_id = auth.uid());

-- The app owner (you) needs to see and feature every listing, including ones
-- not yet active. Replace the email below with your own account's email,
-- then run just this part again any time you add another admin.
create table public.admins (
  user_id uuid primary key references public.profiles(id) on delete cascade
);
alter table public.admins enable row level security;
create policy "Admins can read the admin list" on public.admins
  for select to authenticated using (true);

create or replace function public.is_admin()
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists(select 1 from public.admins where user_id = auth.uid());
$$;

create policy "Admins read every business" on public.businesses
  for select to authenticated using (public.is_admin());
create policy "Admins update every business" on public.businesses
  for update to authenticated using (public.is_admin()) with check (public.is_admin());

insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
values ('business-photos', 'business-photos', true, 3145728, array['image/jpeg','image/png','image/webp'])
on conflict (id) do nothing;

create policy "Users upload their own business photos" on storage.objects
  for insert to authenticated
  with check (bucket_id = 'business-photos' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "Users delete their own business photos" on storage.objects
  for delete to authenticated
  using (bucket_id = 'business-photos' and (storage.foldername(name))[1] = auth.uid()::text);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pitaepfdipbphnihaifc.supabase.co";
const SUPABASE_ANON_KEY = sb_publishable_dryoPcdWwUqQLcvTcM9quQ_hA8uCG3v

const keysSet = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_ANON_KEY.startsWith("PASTE");
const libOk = typeof supabase !== "undefined";
const db = (keysSet && libOk) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATEGORIES = ['Food','Fashion','Beauty','Electronics','Services','Home','Other'];

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),3200);
}
function thumbHTML(url, name, big){
  const cls = big ? 'thumbBig' : 'thumb';
  if(url) return `<img class="${cls}" src="${esc(url)}" alt="">`;
  return `<div class="${cls} ph">${esc((name||'B').trim().charAt(0).toUpperCase())}</div>`;
}
function setupHTML(){
  return `<div class="card">
    <h3>Set up LocalLink</h3>
    <p class="muted" style="margin:0">Do this once. Everything is free.</p>
    <ol class="steps">
      <li>Create a free project at <b>supabase.com</b>.</li>
      <li>Open <b>SQL Editor</b> &gt; <b>New query</b>. Tap the button below, paste, then <b>Run</b>.</li>
      <li>In the SQL, find the <code>admins</code> section comment and sign up in the app first with your own account, then come back and run: <code>insert into public.admins (user_id) select id from public.profiles where display_name = 'your name';</code> once you know your profile row — or simplest, sign up, then in Supabase's Table Editor open <code>profiles</code>, copy your row's id, and insert it into <code>admins</code> directly.</li>
      <li>Open <b>Project Settings &gt; API</b>. Copy the <b>Project URL</b> and <b>anon (publishable)</b> key.</li>
      <li>In this file, paste those two values into <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script.</li>
      <li>In Supabase, open <b>Authentication &gt; Providers &gt; Email</b> and turn off <b>Confirm email</b> while you test.</li>
      <li>Upload this file to GitHub Pages (or similar). Paste that address into <b>Authentication &gt; URL Configuration &gt; Site URL</b>.</li>
    </ol>
    <button class="btn btn-teal" onclick="copySql()">Copy the SQL</button>
    <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Preview the SQL</summary><pre class="sqlbox" id="sqlBox"></pre></details>
  </div>`;
}
async function copySql(){
  const text = $('sqlText').textContent.trim();
  try{ await navigator.clipboard.writeText(text); toast('SQL copied. Paste it into the Supabase SQL Editor.'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok ? 'SQL copied.' : 'Could not copy. Open the preview and copy it by hand.');
  }
}

let session=null, profile=null, isAdmin=false, page='explore';
let allBiz=[], activeCat='All', openBiz=null, myBiz=[];

function showPage(p){
  page=p;
  ['explore','add','me'].forEach(x=>{ $('page-'+x).style.display = x===p ? 'block':'none'; $('n-'+x).classList.toggle('active', x===p); });
  window.scrollTo(0,0);
  render();
}
function updateTop(){ $('who').textContent = session ? (profile?.display_name || 'User') : 'Sign in'; }
function requireLogin(){ if(session) return true; toast('Please sign in first'); showPage('me'); return false; }

function render(){
  if(!db){
    const target = {explore:'exploreList', add:'addBody', me:'meBody'}[page];
    $('bizView').style.display='none';
    $(target).innerHTML = setupHTML();
    const box=$('sqlBox'); if(box) box.textContent=$('sqlText').textContent.trim();
    return;
  }
  if(page==='explore') openBiz ? drawBizView() : renderExplore();
  else if(page==='add') renderAdd();
  else renderMe();
}

async function loadProfile(){
  profile=null; isAdmin=false;
  if(!session) return;
  const {data} = await db.from('profiles').select('display_name').eq('id', session.user.id).maybeSingle();
  profile = data;
  const a = await db.rpc('is_admin');
  isAdmin = !a.error && a.data === true;
}

async function signUp(){
  const name=$('authName').value.trim(), email=$('authEmail').value.trim(), password=$('authPass').value;
  if(!name){toast('Enter a display name'); return}
  if(!email){toast('Enter your email'); return}
  if(password.length<8){toast('Password must be at least 8 characters'); return}
  const {data,error} = await db.auth.signUp({email,password,options:{data:{display_name:name}}});
  if(error){toast(error.message); return}
  if(!data.session) toast('Check your email to confirm, then sign in.'); else toast('Account created');
}
async function signIn(){
  const email=$('authEmail').value.trim(), password=$('authPass').value;
  if(!email||!password){toast('Enter your email and password'); return}
  const {error} = await db.auth.signInWithPassword({email,password});
  if(error) toast(error.message);
}
async function signOut(){ await db.auth.signOut(); toast('Signed out'); }
async function saveName(){
  const name=$('meName').value.trim();
  if(!name){toast('Enter a display name'); return}
  const {error} = await db.from('profiles').update({display_name:name}).eq('id', session.user.id);
  if(error){toast(error.message); return}
  await loadProfile(); updateTop(); toast('Name saved');
}

function drawCatChips(){
  const cats = ['All', ...CATEGORIES];
  $('catChips').innerHTML = cats.map(c=>`<div class="chip ${c===activeCat?'on':''}" onclick="setCat('${c}')">${esc(c)}</div>`).join('');
}
function setCat(c){ activeCat=c; drawCatChips(); drawList(); }
async function renderExplore(){
  $('bizView').style.display='none';
  drawCatChips();
  $('exploreList').innerHTML = '<div class="muted pad">Loading…</div>';
  const {data,error} = await db.from('businesses').select('*').eq('active', true).order('featured',{ascending:false}).order('created_at',{ascending:false});
  if(error){ $('exploreList').innerHTML = `<div class="card">Could not load businesses: ${esc(error.message)}</div>`; return; }
  allBiz = data || [];
  drawList();
}
function drawList(){
  const q = ($('search')?.value || '').trim().toLowerCase();
  let list = allBiz.filter(b => activeCat==='All' || b.category===activeCat);
  if(q) list = list.filter(b => b.name.toLowerCase().includes(q) || b.description.toLowerCase().includes(q));
  if(!list.length){
    $('exploreList').innerHTML = `<div class="card muted">${allBiz.length ? 'No businesses match.' : 'No businesses listed yet. Be the first — tap List business.'}</div>`;
    return;
  }
  $('exploreList').innerHTML = '<div class="card">' + list.map(b => `
    <div class="row" onclick="showBiz('${b.id}')">
      ${thumbHTML(b.photo_url, b.name)}
      <div class="grow">
        <div class="t">${esc(b.name)} ${b.featured ? '<span class="badge featured">Featured</span>' : ''}</div>
        <div class="muted" style="font-size:12px">${esc(b.category)}${b.location ? ' · ' + esc(b.location) : ''}</div>
        <div class="d">${esc(b.description)}</div>
      </div></div>`).join('') + '</div>';
}
function showBiz(id){
  openBiz = allBiz.find(b=>b.id===id) || myBiz.find(b=>b.id===id);
  if(!openBiz) return;
  window.scrollTo(0,0); drawBizView();
}
function drawBizView(){
  const b = openBiz;
  $('exploreList').style.display='none'; $('bizView').style.display='block';
  const wa = b.phone ? b.phone.replace(/[^0-9]/g,'') : '';
  $('bizView').innerHTML = `
    <div class="card">
      <a onclick="closeBiz()" style="font-size:14px">← All businesses</a>
      ${thumbHTML(b.photo_url, b.name, true)}
      <h2 style="margin:12px 0 2px">${esc(b.name)}</h2>
      <div class="muted" style="font-size:13px">${esc(b.category)}${b.location ? ' · ' + esc(b.location) : ''}</div>
      ${b.featured ? '<div class="badge featured" style="display:inline-block;margin-top:8px">Featured</div>' : ''}
      <p style="font-size:14px;line-height:1.6;white-space:pre-wrap;margin-top:12px">${esc(b.description)}</p>
      ${b.phone ? `
      <div class="two">
        <a class="btn btn-teal" style="text-align:center;text-decoration:none" href="tel:${esc(b.phone)}">Call</a>
        <a class="btn btn-amber" style="text-align:center;text-decoration:none" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>
      </div>` : '<p class="muted">No contact number listed.</p>'}
    </div>`;
}
function closeBiz(){ openBiz=null; $('bizView').style.display='none'; $('exploreList').style.display='block'; }

// ---------- add / manage a listing ----------
let editingId = null;
function renderAdd(){
  if(!session){
    $('addBody').innerHTML = '<div class="card"><h3>List your business</h3><p class="muted">Create a free account to add your business — name, photo, description and contact number.</p><button class="btn btn-teal" onclick="showPage(\'me\')">Sign in or create account</button></div>';
    return;
  }
  $('addBody').innerHTML = `
    <div class="card">
      <b>${editingId ? 'Edit your listing' : 'List your business'}</b>
      <div style="display:flex;gap:12px;align-items:flex-start;margin-top:10px">
        <div id="bfPhotoWrap"></div>
        <div style="flex:1;min-width:0">
          <input type="file" id="bfPhoto" accept="image/png,image/jpeg,image/webp" onchange="previewPhoto()">
          <small class="muted">Photo: JPG, PNG or WebP, up to 3 MB.</small>
        </div>
      </div>
      <input id="bfName" placeholder="Business name" maxlength="120">
      <select id="bfCat">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
      <input id="bfLoc" placeholder="Location (e.g. Lagos, Ikeja)" maxlength="160">
      <input id="bfPhone" placeholder="Phone number (for calls and WhatsApp)" maxlength="40">
      <textarea id="bfDesc" placeholder="Describe the business — what they sell or do" maxlength="2000"></textarea>
      <button class="btn btn-dark" onclick="helpWriteDesc()">✦ Help me write this</button>
      <button class="btn btn-teal" id="bfSave" onclick="saveBiz()">${editingId ? 'Save changes' : 'Publish listing'}</button>
    </div>
    <div class="card"><b>Your listings</b><div id="myBizList" style="margin-top:6px"></div></div>`;
  $('bfPhotoWrap').innerHTML = thumbHTML(null, 'B', true);
  if(editingId){
    const b = myBiz.find(x=>x.id===editingId);
    if(b){
      $('bfName').value=b.name; $('bfCat').value=b.category; $('bfLoc').value=b.location||'';
      $('bfPhone').value=b.phone||''; $('bfDesc').value=b.description;
      $('bfPhotoWrap').innerHTML = thumbHTML(b.photo_url, b.name, true);
    }
  }
  loadMyBiz();
}
function previewPhoto(){
  const f=$('bfPhoto').files[0]; if(!f) return;
  $('bfPhotoWrap').innerHTML = `<img class="thumbBig" src="${URL.createObjectURL(f)}" alt="">`;
}
async function uploadPhoto(file){
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Use a JPG, PNG or WebP image'); return false}
  if(file.size > 3*1024*1024){toast('Photo is bigger than 3 MB'); return false}
  const ext = file.type==='image/png' ? 'png' : file.type==='image/webp' ? 'webp' : 'jpg';
  const path = `${session.user.id}/${Date.now()}.${ext}`;
  const {error} = await db.storage.from('business-photos').upload(path, file, {contentType:file.type, cacheControl:'3600'});
  if(error){toast('Photo upload failed: '+error.message); return false}
  return db.storage.from('business-photos').getPublicUrl(path).data.publicUrl;
}
async function saveBiz(){
  if(!requireLogin()) return;
  const name=$('bfName').value.trim(), category=$('bfCat').value, location=$('bfLoc').value.trim();
  const phone=$('bfPhone').value.trim(), description=$('bfDesc').value.trim();
  if(!name){toast('Enter the business name'); return}
  if(!description){toast('Add a short description'); return}
  $('bfSave').disabled = true;
  try{
    let photoUrl=null;
    const file=$('bfPhoto').files[0];
    if(file){ photoUrl = await uploadPhoto(file); if(photoUrl===false) return; }
    if(editingId){
      const patch={name,category,location,phone,description};
      if(photoUrl) patch.photo_url=photoUrl;
      const {error} = await db.from('businesses').update(patch).eq('id', editingId);
      if(error){toast(error.message); return}
      toast('Listing updated');
    } else {
      const {error} = await db.from('businesses').insert({owner_id:session.user.id,name,category,location,phone,description,photo_url:photoUrl});
      if(error){toast(error.message); return}
      toast('Listing published');
      editingId=null;
    }
    $('bfPhoto').value='';
    await renderAdd();
  } finally { $('bfSave').disabled=false; }
}
async function loadMyBiz(){
  const {data,error} = await db.from('businesses').select('*').eq('owner_id', session.user.id).order('created_at',{ascending:false});
  myBiz = error ? [] : data;
  $('myBizList').innerHTML = myBiz.length ? myBiz.map(b=>`
    <div class="row" style="cursor:default">
      ${thumbHTML(b.photo_url, b.name)}
      <div class="grow">
        <div class="t">${esc(b.name)} ${b.featured?'<span class="badge featured">Featured</span>':''} ${!b.active?'<span class="badge">Hidden</span>':''}</div>
        <div class="muted" style="font-size:12px">${esc(b.category)}</div>
      </div>
      <a onclick="editBiz('${b.id}')">Edit</a>
    </div>`).join('') : '<div class="muted" style="padding:10px 0">No listings yet.</div>';
}
function editBiz(id){ editingId=id; renderAdd(); window.scrollTo(0,0); }

// Simple phrase helper: not real AI — expands a few rough words into a fuller
// sentence using set patterns. Honest placeholder until a real AI API is wired in.
function helpWriteDesc(){
  const raw = $('bfDesc').value.trim();
  const name = $('bfName').value.trim() || 'This business';
  const cat = $('bfCat').value;
  if(!raw){ toast('Type a few words first, like "jollof rice, fast delivery, Lagos"'); return; }
  const bits = raw.split(/,|\.|\n/).map(s=>s.trim()).filter(Boolean);
  const lead = `${name} is a ${cat.toLowerCase()} business`;
  const mid = bits.length ? ` known for ${bits.join(', ')}.` : '.';
  const close = ' Reach out today to place an order or ask a question.';
  $('bfDesc').value = lead + mid + close;
  toast('Draft written — edit it to sound like you');
}

// ---------- me / admin ----------
function renderMe(){
  if(!session){
    $('meBody').innerHTML = `<div class="card">
      <h3>Welcome to LocalLink</h3>
      <p class="muted" style="margin:0">Sign in to list a business or manage your listings.</p>
      <input id="authName" placeholder="Display name (new accounts only)" maxlength="40">
      <input id="authEmail" type="email" placeholder="Email">
      <input id="authPass" type="password" placeholder="Password (8+ characters)">
      <div class="two"><button class="btn btn-teal" onclick="signIn()">Sign in</button><button class="btn btn-dark" onclick="signUp()">Create account</button></div>
    </div>`;
    return;
  }
  $('meBody').innerHTML = `
    <div class="card">
      <b>Account</b>
      <p class="muted" style="margin:6px 0 0">${esc(session.user.email)}</p>
      <input id="meName" value="${esc(profile?.display_name||'')}" maxlength="40" placeholder="Display name">
      <div class="two"><button class="btn btn-teal" onclick="saveName()">Save name</button><button class="btn btn-dark" onclick="signOut()">Sign out</button></div>
    </div>
    <div id="adminBox"></div>`;
  renderAdmin();
}
async function renderAdmin(){
  const box=$('adminBox');
  if(!isAdmin){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="card"><b>Owner dashboard</b><p class="muted" style="margin:6px 0 0;font-size:13px">Every listing — mark a business Featured once they pay, or hide one that hasn\'t paid.</p><div id="admList" style="margin-top:10px">Loading…</div></div>';
  const {data,error} = await db.from('businesses').select('*').order('created_at',{ascending:false});
  if(error){ $('admList').innerHTML = esc(error.message); return; }
  $('admList').innerHTML = (data||[]).map(b=>`
    <div class="row" style="cursor:default">
      ${thumbHTML(b.photo_url, b.name)}
      <div class="grow">
        <div class="t">${esc(b.name)}</div>
        <div class="muted" style="font-size:12px">${esc(b.category)} · ${b.featured?'Featured':'Standard'} · ${b.active?'Active':'Hidden'}</div>
      </div>
      <a onclick="toggleFeatured('${b.id}',${b.featured?'false':'true'})">${b.featured?'Unfeature':'Feature'}</a>
    </div>`).join('') || '<div class="muted">No listings yet.</div>';
}
async function toggleFeatured(id, val){
  const {error} = await db.from('businesses').update({featured: val==='true'}).eq('id', id);
  if(error){toast(error.message); return}
  renderAdmin();
}

async function init(){
  if(!db){ render(); return; }
  const {data} = await db.auth.getSession();
  session = data.session;
  await loadProfile(); updateTop();
  db.auth.onAuthStateChange((event,s)=>{
    session=s;
    if(event==='INITIAL_SESSION' || event==='TOKEN_REFRESHED') return;
    setTimeout(async ()=>{ await loadProfile(); updateTop(); if(!session){myBiz=[]; editingId=null; openBiz=null;} render(); },0);
  });
  render();
}
init();
</script>
